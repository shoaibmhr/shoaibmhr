<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Welcome to Shoaib's Github">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.6" stop-color="#0b0b0d"/>
      <stop offset="1" stop-color="#1c1c20"/>
    </linearGradient>
    <linearGradient id="dune1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a8a90"/>
      <stop offset="1" stop-color="#2a2a2e"/>
    </linearGradient>
    <linearGradient id="dune2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a50"/>
      <stop offset="1" stop-color="#0d0d0f"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.95"/>
    </linearGradient>
    <clipPath id="reveal">
      <rect x="0" y="60" width="0" height="70">
        <animate attributeName="width" from="0" to="1000" dur="2.4s" begin="0.3s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="1000" height="300" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="80" cy="40" r="1.2" opacity="0.8"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="85" r="1" opacity="0.6"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="310" cy="30" r="1.4" opacity="0.7"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="22" r="1" opacity="0.6"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="35" r="1.3" opacity="0.8"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="90" r="1" opacity="0.5"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="45" r="1.5" opacity="0.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="110" r="1" opacity="0.6"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- back dune -->
  <path d="M0 215 C120 170 230 195 340 200 C460 205 520 150 640 160 C760 170 860 205 1000 180 L1000 300 L0 300 Z" fill="url(#dune1)" opacity="0.85"/>
  <!-- front dune -->
  <path d="M0 255 C140 225 260 245 380 238 C520 230 600 205 740 220 C850 232 930 250 1000 240 L1000 300 L0 300 Z" fill="url(#dune2)"/>

  <!-- winding road -->
  <path d="M520 300 C540 280 470 262 500 242 C535 220 585 232 560 205 C540 184 585 176 600 162 C610 152 640 150 662 158 C640 160 625 166 615 176 C600 192 565 196 585 214 C612 238 548 244 520 262 C500 276 560 288 575 300 Z" fill="url(#road)"/>

  <!-- title text with typing reveal -->
  <g clip-path="url(#reveal)">
    <text x="500" y="108" text-anchor="middle" font-family="'Fira Code','Courier New',monospace" font-size="38" font-weight="500" fill="#ffffff" letter-spacing="1">Welcome to Shoaib's Github &lt;/&gt;</text>
  </g>

  <!-- subtitle -->
  <text x="500" y="138" text-anchor="middle" font-family="'Fira Code','Courier New',monospace" font-size="16" fill="#9ca3af" opacity="0">
    Software Engineering Student • Full-Stack Web Developer
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="2.4s" fill="freeze"/>
  </text>

  <!-- blinking cursor -->
  <rect x="0" y="78" width="3" height="40" fill="#ffffff">
    <animate attributeName="x" from="95" to="905" dur="2.4s" begin="0.3s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
    <set attributeName="display" to="none" begin="2.9s"/>
  </rect>
</svg>
